name: Customer Events Scheduler

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping-customer-events:
    name: Ping Customer Events Cron
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Customer Events
        run: |
          curl --retry 3 --retry-delay 10 --retry-all-errors --fail-with-body -sS -m 30 -X GET "https://app.zicabella.com/api/cron/customer-events" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
